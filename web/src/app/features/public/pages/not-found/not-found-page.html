<div
  style="
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    width: 100%;
    background: #f8fafc;
    font-family: system-ui, sans-serif;
  "
>
  <div
    style="
      width: 90vw;
      max-width: 420px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      padding: 2.5rem 2rem;
      text-align: center;
    "
  >
    <div
      style="
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: #f1f5f9;
        margin-bottom: 1rem;
      "
    >
      <svg
        width="40"
        height="40"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#475569"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle
          cx="12"
          cy="12"
          r="10"
        />
        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
        <line
          x1="12"
          y1="17"
          x2="12.01"
          y2="17"
        />
      </svg>
    </div>
    <h1 style="font-size: 3rem; font-weight: 800; margin: 0; color: #111827">404</h1>
    <div
      style="
        font-size: 1.1rem;
        font-weight: 600;
        color: #4b5563;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-top: 0.25rem;
      "
    >
      Página no encontrada
    </div>
    <p style="color: #374151; line-height: 1.5; margin: 1.25rem 0 1.75rem">
      La dirección no existe o fue movida. Revise el enlace.
    </p>
    <div style="display: flex; flex-direction: column; gap: 0.75rem">
      <button
        type="button"
        (click)="homepage()"
        style="
          width: 100%;
          padding: 0.7rem 1rem;
          border: none;
          border-radius: 8px;
          background: #002259;
          color: #fff;
          font-weight: 600;
          cursor: pointer;
        "
      >
        Volver al inicio
      </button>
    </div>
    <div style="margin-top: 1.5rem; color: #9ca3af; font-size: 0.72rem">
      Error Ref: ROUTE_NOT_FOUND
    </div>
  </div>
</div>
