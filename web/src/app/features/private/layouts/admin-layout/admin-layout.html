<div class="admin-layout">
  <aside class="sidebar">
    <div class="logo">SC PHISIS</div>

    <div class="usuario">
      <div class="avatar">
        <i class="pi pi-user"></i>
      </div>
      <div>
        <p class="nombre">{{ usuario.nombre }}</p>
        <p class="usuario-nombre">{{ usuario.usuario }}</p>
      </div>
    </div>

    <nav class="nav">
      @for (item of navItems; track item.href) {
        <a
          [routerLink]="item.href"
          routerLinkActive="activo"
          [routerLinkActiveOptions]="item.exact ? { exact: true } : {}"
        >
          <i [class]="item.icon"></i>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </aside>

  <div class="principal">
    <header class="header">
      <div class="logos">
        <div class="logo-peru">
          <span>🇵🇪</span>
          <div>
            <p class="bold">PERÚ</p>
            <p class="small">Ministerio del Ambiente</p>
          </div>
        </div>
        <div class="sep"></div>
        <div class="logo-senamhi">
          <span>🌊</span>
          <span class="bold">Senamhi</span>
        </div>
      </div>
      <a routerLink="/monitoreo" class="salir" title="Salir al portal">
        <i class="pi pi-sign-out"></i>
      </a>
    </header>

    <main class="contenido">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
