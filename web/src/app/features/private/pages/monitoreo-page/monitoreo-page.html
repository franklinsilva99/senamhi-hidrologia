<app-topic-banner
  subtitle="Sistema de Monitoreo Hidrológico"
  title="Hidrología / Monitoreo Hidrológico"
  description="Información disponible de niveles y/o caudales de la red de monitoreo hidrológico del Servicio Nacional de Meteorología e Hidrología del Perú (SENAMHI)."
></app-topic-banner>

<nav class="tabs-producto">
  <span class="tab activa">Monitoreo Hidrológico</span>
  <span class="tab deshabilitada">Información Diaria</span>
  <span class="tab deshabilitada">Información Mensual</span>
</nav>

<div class="monitoreo">
  @if (cargando()) {
    <div class="cargando">
      <p-progressSpinner />
    </div>
  }

  <div class="mapa-contenedor">
    <div id="mapa-estaciones" class="mapa"></div>

    @if (seleccionada()) {
      <div class="hidrograma-overlay">
        <div class="hidrograma-card">
          <div class="hidrograma-header">
            <div>
              <h3 class="hidrograma-titulo">{{ tituloHidrograma() }}</h3>
              <p class="hidrograma-subtitulo">{{ subtituloHidrograma() }}</p>
            </div>
            <p-button
              icon="pi pi-times"
              [text]="true"
              [rounded]="true"
              aria-label="Cerrar"
              (onClick)="cerrar()"
            />
          </div>

          <div class="hidrograma-controles">
            <div class="botones">
              <button
                type="button"
                [class.activo]="variable() === 'nivel'"
                (click)="cambiarVariable('nivel')"
              >
                Nivel
              </button>
              <button
                type="button"
                [class.activo]="variable() === 'caudal'"
                (click)="cambiarVariable('caudal')"
              >
                Caudal
              </button>
            </div>
            <div class="botones">
              <button
                type="button"
                [class.activo]="granularidad() === 'horario'"
                (click)="cambiarGranularidad('horario')"
              >
                Horario
              </button>
              <button
                type="button"
                [class.activo]="granularidad() === 'diario'"
                (click)="cambiarGranularidad('diario')"
              >
                Diario
              </button>
            </div>
          </div>

          @if (hidrograma()) {
            <div class="hidrograma-chart-contenedor">
              <div echarts [options]="hidrograma()!" class="hidrograma-chart"></div>
              <div class="hidrograma-watermark">SENAMHI</div>
            </div>
          }

          <div class="hidrograma-leyenda">
            <span><i style="background: #0000ff"></i> Datos</span>
            <span><i style="background: #ee3d43"></i> Rojo</span>
            <span><i style="background: #fca326"></i> Naranja</span>
            <span><i style="background: #ffeb3b"></i> Amarillo</span>
          </div>
        </div>
      </div>
    }
  </div>
</div>
