<div class="home-page">
  <div class="metricas">
    <p-card>
      <div class="metrica">
        <span class="metrica-valor">{{ totalEstaciones }}</span>
        <span class="metrica-label">Estaciones</span>
      </div>
    </p-card>
    <p-card>
      <div class="metrica">
        <span class="metrica-valor">{{ totalEnAlerta }}</span>
        <span class="metrica-label">En alerta</span>
      </div>
    </p-card>
    <p-card>
      <div class="metrica">
        <span class="metrica-valor">{{ totalAvisosVigentes }}</span>
        <span class="metrica-label">Avisos vigentes</span>
      </div>
    </p-card>
  </div>

  <p-card header="Estado de estaciones">
    <p-table
      [value]="estaciones()"
      [loading]="cargando()"
      [scrollable]="true"
      scrollHeight="420px"
    >
      <ng-template #header>
        <tr>
          <th>Estación</th>
          <th>Río</th>
          <th>Variable</th>
          <th>Valor actual</th>
          <th>Estado</th>
        </tr>
      </ng-template>
      <ng-template #body let-fila>
        <tr>
          <td>{{ fila.station.estacion }}</td>
          <td>{{ fila.station.rio }}</td>
          <td>{{ fila.deteccion?.preferencia ?? '—' }}</td>
          <td>{{ fila.deteccion?.valorActual ?? '—' }}</td>
          <td>
            <p-tag [value]="nivelDe(fila)" [style]="tagStyle(fila)" />
          </td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>
</div>
