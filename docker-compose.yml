services:
  postgres:
    image: postgres:16
    container_name: hidrologia-postgres
    environment:
      POSTGRES_DB: hidrologia
      POSTGRES_USER: hidrologia
      POSTGRES_PASSWORD: hidrologia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hidrologia -d hidrologia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
